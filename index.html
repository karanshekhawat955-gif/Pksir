<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rishika Kids Learning Zone</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Roboto,system-ui,'Noto Sans Devanagari',sans-serif}
body{background:linear-gradient(#e6edff,#f5f7ff 40%,#fdf3ff);color:#172044;min-height:100vh;overflow-x:hidden}
main{max-width:760px;margin:auto;padding:12px 14px 60px}
button{border:0;cursor:pointer;font-weight:700;color:inherit;font-size:1rem}
h2{margin:22px 0 4px;font-size:1.5rem}.sub{color:#66708f;margin-bottom:12px}
.top{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.pill{background:#fff;border-radius:30px;padding:9px 14px;box-shadow:0 4px 0 #c9d2f5}
.hero{margin-top:12px;border-radius:30px;padding:22px 14px;text-align:center;color:#fff;background:linear-gradient(135deg,#4169e1,#8a4de8 55%,#ee5fa7);box-shadow:0 12px 0 #3b2c9b33,0 20px 40px #6a4de855;position:relative;overflow:hidden}
.hero h1{font-size:1.7rem;text-shadow:0 2px 0 #3a2a90,0 4px 0 #2d2070,0 8px 12px #0006}
.stage{perspective:700px;height:130px;display:grid;place-items:center}
.cube{width:76px;height:76px;position:relative;transform-style:preserve-3d;animation:cube 9s linear infinite}
.cube i{position:absolute;inset:0;display:grid;place-items:center;font-size:2.6rem;font-style:normal;background:#fff;border:3px solid #ffd54a;border-radius:12px;backface-visibility:hidden}
@keyframes cube{from{transform:rotateX(-18deg) rotateY(0)}to{transform:rotateX(-18deg) rotateY(360deg)}}
.float{position:absolute;font-size:1.8rem;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-14px) rotate(12deg)}}
.classes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cls{background:#fff;border-radius:20px;padding:14px 4px;border:3px solid transparent;box-shadow:0 6px 0 #ccd5f6}
.cls span{display:block;font-size:2rem;margin-bottom:4px}
.cls.on{border-color:#4169e1;background:#edf1ff;color:#2848b8;transform:translateY(4px);box-shadow:0 2px 0 #4169e1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.stats div{background:#fff;border-radius:20px;padding:12px;box-shadow:0 6px 0 #ccd5f6}
.stats b{font-size:1.5rem;display:block}.stats small{color:#66708f}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:16px;perspective:1000px}
.game{background:#fff;border-radius:28px;padding:16px;display:flex;flex-direction:column;gap:8px;transform-style:preserve-3d;box-shadow:0 8px 0 #ccd5f6,0 18px 30px #4169e122;transition:transform .15s}
.game.pro{background:linear-gradient(160deg,#fff6d6,#fff)}
.tag{align-self:flex-start;background:#ffedaa;color:#7a5600;font-size:.75rem;font-weight:800;padding:4px 10px;border-radius:20px}
.icon{width:84px;height:84px;display:grid;place-items:center;font-size:3rem;border-radius:24px;background:linear-gradient(145deg,#fff,#e9eeff);box-shadow:7px 9px 0 #d3daf5;transform:translateZ(35px);animation:bob 4s ease-in-out infinite}
.game h3{font-size:1.15rem}.game p{color:#66708f;font-size:.9rem;flex:1}
.play,.big{background:#4169e1;color:#fff;border-radius:16px;padding:13px;box-shadow:0 5px 0 #253f99}
.pro .play{background:#edf1ff;color:#2848b8;box-shadow:0 5px 0 #c9d2f5}
button:active{transform:translateY(3px)}
.panel{background:#fff;border-radius:28px;padding:18px;margin-top:14px;box-shadow:0 8px 0 #ccd5f6;text-align:center;animation:flip .45s}
@keyframes flip{from{transform:perspective(900px) rotateY(-25deg);opacity:0}}
.pics{perspective:500px;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:8px 0;min-height:70px;align-items:center}
.pics span{font-size:3rem;display:inline-block;animation:spin 3s ease-in-out infinite;filter:drop-shadow(0 10px 5px #0004)}
.pics span.txt{font-weight:900;color:#4169e1;text-shadow:2px 2px 0 #b9c6f5,4px 4px 0 #9aa9e0}
@keyframes spin{0%,100%{transform:rotateY(-35deg)}50%{transform:rotateY(35deg) translateY(-10px)}}
.voice{display:inline-flex;gap:6px;justify-content:center;margin:6px 0}
.voice button{background:#fff0b8;border-radius:14px;padding:8px 11px;font-size:.85rem}
.opt{display:flex;gap:8px;align-items:center;margin:10px 0}
.opt>button{flex:1;background:#edf1ff;border-radius:16px;padding:13px;box-shadow:0 5px 0 #c9d2f5}
.opt>button.ok{background:#9af0b2;box-shadow:0 5px 0 #3ca75d}.opt>button.no{background:#ffb1b1;box-shadow:0 5px 0 #c95a5a}
.owl{font-size:4.5rem;display:inline-block;animation:spin 1s ease-in-out infinite}
.island{height:300px;perspective:800px;position:relative}
.land{position:absolute;left:50%;top:50%;width:260px;height:260px;margin:-130px;border-radius:50%;background:radial-gradient(#7bd66b 55%,#f4d58a 58% 68%,#46b6e8 70%);transform:rotateX(55deg);transform-style:preserve-3d;box-shadow:0 30px 0 #2484b5}
.chest{position:absolute;font-size:2.2rem;background:none;transform:rotateX(-55deg);margin:-22px;animation:glow 2s infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 10px #ffd000)}}
canvas{width:100%;background:#fff;border:4px dashed #8a4de8;border-radius:18px;touch-action:none}
.dot{width:36px;height:36px;border-radius:50%;margin:4px;box-shadow:0 4px 0 #0003}
.note{text-align:left;border-bottom:2px dashed #dbe1fa;padding:10px 0}
.confetti{position:fixed;top:-30px;font-size:1.5rem;animation:fall 2.2s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;perspective:900px}
.mcard{background:none;height:100px;padding:0}
.mcard span{display:block;position:relative;height:100%;transform-style:preserve-3d;transition:transform .4s}
.mcard i{position:absolute;inset:0;display:grid;place-items:center;font-style:normal;font-size:1.5rem;border-radius:18px;backface-visibility:hidden;box-shadow:0 6px 0 #aab6e8}
.mcard i:first-child{background:#4169e1}.mcard i:last-child{background:#fff;transform:rotateY(180deg)}
.mcard.up span{transform:rotateY(180deg)}.mcard.done i:last-child{background:#9af0b2}
.bar{height:12px;background:#edf1ff;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#4169e1}
@media(max-width:360px){.classes{grid-template-columns:repeat(3,1fr)}}
@media print{body{background:#fff}.top,.big,.voice{display:none}.panel{box-shadow:none;animation:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
/* रंगीन 3D कार्ड */
.games{gap:22px 18px;perspective:800px;padding:6px 4px}
.games .game{--a:#ff6b6b;--b:#ff9f43;--d:#b8452f;color:#fff;border:3px solid #ffffffaa;background:linear-gradient(150deg,var(--a),var(--b));transform-style:flat;transform:rotateX(5deg) rotateY(-5deg);box-shadow:3px 3px 0 var(--d),6px 6px 0 var(--d),9px 10px 0 var(--d),12px 22px 24px #2a1a6650,inset 0 3px 0 #fff8}
.games .game:nth-child(even){transform:rotateX(5deg) rotateY(5deg);box-shadow:-3px 3px 0 var(--d),-6px 6px 0 var(--d),-9px 10px 0 var(--d),-12px 22px 24px #2a1a6650,inset 0 3px 0 #fff8}
.games .game:nth-child(8n+2){--a:#2f80ed;--b:#22c1dc;--d:#1b4f99}
.games .game:nth-child(8n+3){--a:#11a36a;--b:#6fcf4a;--d:#0b6b45}
.games .game:nth-child(8n+4){--a:#8e44ec;--b:#d160e8;--d:#55269a}
.games .game:nth-child(8n+5){--a:#ec407a;--b:#ff7eb3;--d:#9c2451}
.games .game:nth-child(8n+6){--a:#0f9b9b;--b:#2fd3b0;--d:#08605f}
.games .game:nth-child(8n+7){--a:#f2780c;--b:#ffbe2e;--d:#a34d00}
.games .game:nth-child(8n){--a:#4a47d5;--b:#7b8cff;--d:#2b2987}
.games .game h3{text-shadow:0 2px 0 var(--d),0 3px 6px #0005;transform:translateZ(30px)}
.games .game p{color:#fff;text-shadow:0 1px 3px #0008}
.games .icon{width:92px;height:92px;font-size:3.4rem;background:radial-gradient(circle at 30% 25%,#fff 45%,#ffe9a8);border-radius:50%;box-shadow:0 7px 0 var(--d),0 16px 18px #0005,inset 0 -6px 10px #0002;animation:pop 3.5s ease-in-out infinite}
@keyframes pop{0%,100%{transform:rotateY(-22deg)}50%{transform:translateY(-7px) rotateY(22deg)}}
.games .game .play{background:linear-gradient(#fff,#ffefb0);color:#2a1a66;box-shadow:0 6px 0 var(--d),0 10px 12px #0004}
.games .game .pill{background:#ffffffe8;color:#2a1a66;box-shadow:0 5px 0 var(--d)}
.games .game .play:active,.games .game .pill:active{transform:translateY(4px);box-shadow:0 1px 0 var(--d)}
.games .tag{box-shadow:0 3px 0 var(--d)}
/* चलती हुई पृष्ठभूमि */
body{background:linear-gradient(120deg,#9fdcff,#d9c2ff,#ffc4dd,#ffe7a8,#b8f2d0);background-size:400% 400%;animation:sky 18s ease infinite}
@keyframes sky{50%{background-position:100% 100%}}
#bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:-1}
#bg span{position:absolute;left:0;top:0;will-change:transform}
#bg .up{animation:rise linear infinite}
@keyframes rise{from{transform:translate(0,110vh) rotate(-15deg)}50%{transform:translate(30px,50vh) rotate(15deg)}to{transform:translate(0,-15vh) rotate(-15deg)}}
#bg .side{animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-25vw)}to{transform:translateX(115vw)}}
h2{text-shadow:0 2px 0 #fff}.sub{color:#3d4670}
/* हर कार्ड के अंदर चलता एनिमेशन */
.games .game{position:relative;overflow:hidden;isolation:isolate}
.fx{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:-1}
.fx b{position:absolute;bottom:-40px;font-size:1.7rem;opacity:.8;color:#fff;animation:bubble 5s linear infinite}
@keyframes bubble{to{transform:translateY(-360px) rotate(360deg)}}
.fx:after{content:'';position:absolute;top:0;bottom:0;width:45px;left:-80px;background:#fff5;transform:skewX(-20deg);animation:shine 3.5s ease-in-out infinite}
@keyframes shine{60%,100%{left:130%}}
.ver{text-align:center;margin-top:24px;color:#3d4670}
/* ===== अंतरिक्ष यात्रा थीम ===== */
body{background:radial-gradient(circle at 20% 10%,#4b2a91,transparent 45%),radial-gradient(circle at 90% 60%,#0d6c8c,transparent 40%),#090a2a;background-attachment:fixed;animation:none}
body:before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(#fff 1.5px,transparent 2px),radial-gradient(#ffe48a 1px,transparent 2px);background-size:90px 90px,53px 53px;animation:twinkle 2.5s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.25}}
#app>h2{color:#fff;text-shadow:0 0 12px #8f7bff}#app>.sub,.ver{color:#c9d0ff}
.games{display:flex;flex-direction:column;gap:10px;perspective:none;padding:10px 0}
.games .game,.games .game:nth-child(even){width:68%;align-self:flex-start;align-items:center;text-align:center;background:none;border:0;box-shadow:none;overflow:visible;transform:none;padding:8px}
.games .game:nth-child(even){align-self:flex-end}
.games .game:not(:last-child):after{content:'· · · 🚀';position:absolute;bottom:-22px;right:-22%;color:#ffe48a;font-size:1.3rem;letter-spacing:4px;transform:rotate(24deg)}
.games .game:nth-child(even):not(:last-child):after{content:'🛸 · · ·';right:auto;left:-22%;transform:rotate(-24deg)}
.games .icon{width:150px;height:150px;font-size:4.6rem;position:relative;margin:14px 0;background:radial-gradient(circle at 30% 26%,#fff 0,var(--b) 22%,var(--a) 55%,var(--d) 82%,#12062e);box-shadow:0 0 35px var(--b),inset -14px -16px 28px #0007;animation:planet 4s ease-in-out infinite}
.games .icon:after{content:'';position:absolute;width:205px;height:62px;border:7px solid var(--b);border-top-color:transparent;border-radius:50%;transform:rotate(-16deg);filter:drop-shadow(0 4px 3px #0008)}
@keyframes planet{50%{transform:translateY(-14px) rotate(7deg) scale(1.05)}}
.games .game h3{font-size:1.3rem;text-shadow:0 0 10px var(--b),0 2px 0 var(--d)}
.games .game p{flex:none}.games .game .play,.games .game .pill{width:100%;border-radius:40px}
.games .game .play{background:linear-gradient(#ffe66b,#ffad1f)}
.fx{display:none}
</style>
</head>
<body>
<main>
<div class="top"><button class="pill" id="home">🏠</button><button class="pill" id="lang"></button></div>
<div id="app"></div>
</main>
<script>
const $=id=>document.getElementById(id);
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e};
const btn=(cls,text,fn)=>{const b=el('button',cls,text);b.onclick=fn;return b};
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[rnd(a.length)];

let S={stars:0,played:0,best:0,cls:0,lang:'hi'};
try{Object.assign(S,JSON.parse(localStorage.getItem('rishika')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('rishika',JSON.stringify(S))}catch(e){}};
let premium=true; // भुगतान शुरू करते समय false करें
const T=(hi,en)=>S.lang==='hi'?hi:en;
const CLASSES=['LKG','UKG','Class 1','Class 2','Class 3','Class 4','Class 5'];
// स्तर: 0 = LKG/UKG, 1 = कक्षा 1-2, 2 = कक्षा 3-5
const band=()=>S.cls<2?0:S.cls<4?1:2;

/* ---------- अध्ययन सामग्री ---------- */
// शब्द: चित्र|English|हिंदी
const WORDS=`🍎|Apple|सेब
⚽|Ball|गेंद
🐱|Cat|बिल्ली
🐶|Dog|कुत्ता
🐘|Elephant|हाथी
🐟|Fish|मछली
🐐|Goat|बकरी
🎩|Hat|टोपी
🍦|Ice cream|आइसक्रीम
🏺|Jug|जग
🪁|Kite|पतंग
🦁|Lion|शेर
🥭|Mango|आम
👃|Nose|नाक
🍊|Orange|संतरा
🦜|Parrot|तोता
👸|Queen|रानी
🐰|Rabbit|खरगोश
☀️|Sun|सूरज
🐯|Tiger|बाघ
☂️|Umbrella|छाता
🚐|Van|वैन
⌚|Watch|घड़ी
🦓|Zebra|ज़ेबरा
🏠|House|घर
🌳|Tree|पेड़
📚|Books|किताबें
🌙|Moon|चाँद
🌸|Flower|फूल
🐄|Cow|गाय`.split('\n').map(x=>x.split('|'));
// अक्षर|चित्र|शब्द
const AKSHAR=`अ|🍒|अनार
आ|🥭|आम
इ|🌿|इमली
ई|🎋|ईख
उ|🦉|उल्लू
ऊ|🐪|ऊँट
क|🕊️|कबूतर
ख|🐰|खरगोश
ग|🐄|गाय
घ|🏠|घर
च|🥄|चम्मच
छ|☂️|छतरी
ज|🚢|जहाज़
झ|🚩|झंडा
ट|🍅|टमाटर
ड|🥁|डमरू
त|🍉|तरबूज़
द|🦷|दाँत
न|🚰|नल
प|🪁|पतंग
फ|🍇|फल
ब|🐐|बकरी
भ|🐻|भालू
म|🐟|मछली
र|🛞|रथ
ल|🌰|लट्टू
स|🍎|सेब
ह|🐘|हाथी`.split('\n').map(x=>x.split('|'));

// प्रश्न: चित्र~हिंदी~English~सही~गलत~गलत   (विकल्प "हिंदी=English")
const parse=s=>s.trim().split('\n').map(l=>{const [p,hi,en,...o]=l.split('~');return{p,hi,en,o:o.map(x=>x.includes('=')?x.split('='):[x,x])}});

const SCIENCE=[parse(`
👀~हम किससे देखते हैं?~What do we see with?~आँख=Eyes~कान=Ears~नाक=Nose
👂~हम किससे सुनते हैं?~What do we hear with?~कान=Ears~हाथ=Hands~आँख=Eyes
👃~हम किससे सूँघते हैं?~What do we smell with?~नाक=Nose~मुँह=Mouth~पैर=Feet
🐄~दूध कौन देता है?~Who gives us milk?~गाय=Cow~शेर=Lion~तोता=Parrot
🐟~पानी में कौन रहता है?~Who lives in water?~मछली=Fish~बिल्ली=Cat~मुर्गी=Hen
🌞~दिन में आसमान में क्या चमकता है?~What shines in the day sky?~सूरज=Sun~चाँद=Moon~दीपक=Lamp
🍌~पका हुआ केला किस रंग का होता है?~What colour is a ripe banana?~पीला=Yellow~नीला=Blue~काला=Black
☔~बारिश में क्या काम आता है?~What helps us in the rain?~छाता=Umbrella~पंखा=Fan~चश्मा=Glasses`),
parse(`
🌱~पौधे को बढ़ने के लिए क्या चाहिए?~What does a plant need to grow?~पानी और धूप=Water and sunlight~सिर्फ़ पत्थर=Only stones~अँधेरा=Darkness
🐸~कौन पानी और ज़मीन दोनों पर रह सकता है?~Who can live on water and land?~मेंढक=Frog~गाय=Cow~कबूतर=Pigeon
🦷~दाँत दिन में कम से कम कितनी बार साफ़ करें?~How many times a day should we brush at least?~दो बार=Twice~कभी नहीं=Never~महीने में एक=Once a month
🌳~पेड़ का कौन सा भाग मिट्टी के अंदर होता है?~Which part of a tree is under the soil?~जड़=Root~पत्ती=Leaf~फूल=Flower
🐝~शहद कौन बनाता है?~Who makes honey?~मधुमक्खी=Honeybee~मक्खी=Housefly~तितली=Butterfly
🌦️~इंद्रधनुष में कितने रंग माने जाते हैं?~How many colours are in a rainbow?~7~5~10
❄️~पानी जमने पर क्या बनता है?~What does water become when it freezes?~बर्फ़=Ice~भाप=Steam~तेल=Oil
🥕~हम गाजर का कौन सा भाग खाते हैं?~Which part of a carrot plant do we eat?~जड़=Root~तना=Stem~फूल=Flower
🚦~लाल बत्ती पर क्या करें?~What do we do at a red light?~रुकें=Stop~दौड़ें=Run~तेज़ चलें=Speed up`),
parse(`
🪐~सूरज के सबसे पास कौन सा ग्रह है?~Which planet is closest to the Sun?~बुध=Mercury~मंगल=Mars~पृथ्वी=Earth
🌳~पौधे भोजन बनाते समय कौन सी गैस लेते हैं?~Which gas do plants take in to make food?~कार्बन डाइऑक्साइड=Carbon dioxide~ऑक्सीजन=Oxygen~हाइड्रोजन=Hydrogen
🫀~शरीर में खून कौन पंप करता है?~Which organ pumps blood?~हृदय=Heart~फेफड़ा=Lung~पेट=Stomach
🫁~साँस लेने का मुख्य अंग कौन सा है?~Which is the main organ for breathing?~फेफड़े=Lungs~गुर्दे=Kidneys~जिगर=Liver
🧲~चुंबक किसे खींचता है?~What does a magnet attract?~लोहा=Iron~लकड़ी=Wood~प्लास्टिक=Plastic

 let t=$('toast');
 if(!t){t=el('div');t.id='toast';t.setAttribute('role','alert');t.style.cssText='position:fixed;left:12px;right:12px;bottom:14px;z-index:9;background:#fff3b0;color:#172044;padding:14px;border-radius:16px;box-shadow:0 8px 20px #0006;text-align:center';document.body.append(t)}
 t.textContent=msg;t.hidden=false;clearTimeout(warn.timer);warn.timer=setTimeout(()=>t.hidden=true,7000);
}
const NO_VOICE='🔇 यहाँ आवाज़ नहीं चल सकती। इस फ़ाइल को Chrome ब्राउज़र में खोलें।';
let current;
function speak(text,l){
 if(!window.speechSynthesis||!window.SpeechSynthesisUtterance)return warn(NO_VOICE);
 speechSynthesis.cancel();
 const u=current=new SpeechSynthesisUtterance(text);
 u.lang=l==='hi'?'hi-IN':'en-IN';u.rate=.85;
 const voices=speechSynthesis.getVoices();
 const v=voices.find(x=>x.lang.replace('_','-')===u.lang)||voices.find(x=>x.lang.startsWith(l));
 if(v)u.voice=v;
 let started=false;
 u.onstart=()=>started=true;
 u.onerror=e=>{if(e.error!=='canceled'&&e.error!=='interrupted')warn('🔇 आवाज़ नहीं चली। फ़ोन की Text-to-speech सेटिंग में हिंदी और English आवाज़ जाँचें।')};
 speechSynthesis.speak(u);
 setTimeout(()=>{if(current===u&&!started&&!speechSynthesis.speaking)warn('🔇 आवाज़ शुरू नहीं हुई। Chrome में खोलें, और मीडिया वॉल्यूम व Text-to-speech सेटिंग जाँचें।')},2500);
}
const stop=()=>window.speechSynthesis&&speechSynthesis.cancel();
function voice(hi,en){
 const d=el('div','voice');
 d.append(btn('', '🔊 हिं',()=>speak(hi,'hi')),btn('','🔊 EN',()=>speak(en,'en')));
 return d;
}
function pics(p){
 const d=el('div','pics');
 const isText=/^[0-9A-Za-z]/.test(p);
 const parts=isText?[p]:[...new Intl.Segmenter().segment(p)].map(x=>x.segment).filter(x=>x.trim());
 parts.forEach((x,i)=>{const s=el('span',isText?'txt':'',x);s.style.animationDelay=i*.15+'s';if(parts.length>8)s.style.fontSize='2rem';d.append(s)});
 return d;
}
function party(){

}

// प्रश्न दिखाना (विकल्पों का पहला क्रम: सही उत्तर सबसे पहले)
function question(a,q,onDone){
 const p=el('div','panel'),right=q.o[0];let tries=0,done=false;
 const opts=shuffle(q.o);
 let say=[`${q.hi} विकल्प: ${opts.map(o=>o[0]).join('। ')}`,`${q.en} Options: ${opts.map(o=>o[1]).join(', ')}`];
 const sound=el('div','voice');
 sound.append(btn('','🔊 हिं',()=>speak(say[0],'hi')),btn('','🔊 EN',()=>speak(say[1],'en')));
 p.append(pics(q.p),el('h3','',T(q.hi,q.en)),sound);
 opts.forEach(o=>{
  const row=el('div','opt');
  const b=btn('',T(...o),()=>{
   if(done||b.classList.contains('no'))return;
   if(o!==right){tries++;b.classList.add('no');speak(T('फिर कोशिश करो','Try again'),S.lang);return}
   done=true;b.classList.add('ok');
   const hi=`शाबाश! सही उत्तर है ${right[0]}। ${q.eh||''}`,en=`Well done! The answer is ${right[1]}. ${q.ee||''}`;
   const ans=el('div');
   say=[hi,en];
   ans.append(el('div','owl','🦉'),pics(q.p),el('p','',T(hi,en)));
   p.append(ans);party();speak(T(hi,en),S.lang);onDone(tries===0,ans);
   ans.scrollIntoView({behavior:'smooth',block:'nearest'});
  });
  row.append(b);p.append(row);
 });
 a.append(p);
}
function start(g){
 const list=g.gen();let i=0,good=0;
 const step=a=>{
  if(i>=list.length){
   const pc=Math.round(good*100/list.length);
   const p=el('div','panel');
   p.append(el('div','owl','🏆'),el('h2','',T('शाबाश!','Great job!')),el('p','sub',T(`पहली बार में सही: ${good}/${list.length}`,`Right on first try: ${good}/${list.length}`)),btn('big',T('फिर खेलें','Play again'),()=>start(g)));
   a.append(p);party();return;
  }
  head(a,T(...g.name),`${CLASSES[S.cls]} • ${i+1}/${list.length}`);
  question(a,list[i],(first,box)=>{
   if(first){good++;S.stars++}
   S.rep=S.rep||{};const r=S.rep[g.id]||(S.rep[g.id]={all:0,good:0});r.all++;if(first)r.good++;
   if(i===list.length-1){S.played++;S.best=Math.max(S.best,Math.round(good*100/list.length))}
   save();
   box.append(btn('big',T('आगे ➡️','Next ➡️'),()=>{i++;go(step)}));
  });
 };
 go(step);
}
function material(g){
 const b=band();
 const bank=g.id==='sci'?SCIENCE[b]:g.id==='gk'?GK[b]:g.id==='hindi'&&b===2?HINDI:g.id==='abc'&&b>0?GRAMMAR[b]:null;
 if(bank)return bank.map(x=>mk(x.p,x.hi,x.en,x.o));
 const seen=new Map();for(let i=0;i<12;i++)g.gen().forEach(q=>seen.set(q.p+q.en,q));
 return [...seen.values()].slice(0,40);
}

  const d=el('div','note'),r=q.o[0];

  p.append(d);
 });
 a.append(p);
}

function art(a){
 head(a,'🎨 '+T('कला स्टूडियो','Art Studio'),T('उँगली से चित्र बनाओ।','Draw with your finger.'));
 const p=el('div','panel'),c=el('canvas');c.width=600;c.height=600;
 const x=c.getContext('2d');x.lineWidth=14;x.lineCap='round';let col='#e0245e',on=false;
 const at=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*600/r.width,(e.clientY-r.top)*600/r.height]};
 c.onpointerdown=e=>{on=true;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...at(e))};
 c.onpointermove=e=>{if(on){x.strokeStyle=col;x.lineTo(...at(e));x.stroke()}};
 c.onpointerup=c.onpointercancel=()=>on=false;
 p.append(c);
 const ideas=el('div');p.append(el('p','sub',T('कोई चित्र चुनो और उस पर रंग भरो:','Pick a picture and paint over it:')),ideas);
 ['🏠','🌳','🌸','🐘','🐟','🦋','🚗','🚀','☀️','🍎','🐰','⛵'].forEach(i=>ideas.append(btn('pill',i,()=>{x.clearRect(0,0,600,600);x.save();x.globalAlpha=.25;x.font='420px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(i,300,330);x.restore()})));
 ['#e0245e','#ff9800','#ffd600','#2e9e44','#2962ff','#8e24aa','#111111','#ffffff'].forEach(k=>{const d=btn('dot','',()=>col=k);d.style.background=k;d.setAttribute('aria-label','colour '+k);p.append(d)});
 p.append(el('br'),btn('big',T('साफ़ करें','Clear'),()=>x.clearRect(0,0,600,600)));a.append(p);
}
function memory(a){
 head(a,'🃏 '+T('जोड़ी मिलाओ','Memory Match'),T('एक जैसे चित्र और शब्द ढूँढो।','Find each picture and its word.'));
 const pairs=[3,4,6][band()];
 const cards=shuffle(shuffle(WORDS).slice(0,pairs).flatMap(w=>[{w,face:w[0]},{w,face:T(w[2],w[1])}]));
 const info=el('p','sub'),grid=el('div','mgrid');
 let open=[],found=0,moves=0;
 cards.forEach(c=>{
  const b=btn('mcard','',()=>{
   if(open.length===2||b.classList.contains('up'))return;
   b.classList.add('up');open.push({b,c});
   if(open.length<2)return;
   moves++;info.textContent=T('चालें: ','Moves: ')+moves;
   const [x,y]=open;
   if(x.c.w===y.c.w){
    open=[];found++;x.b.classList.add('done');y.b.classList.add('done');speak(T(c.w[2],c.w[1]),S.lang);
    if(found===pairs){S.stars+=pairs;S.played++;save();party();a.append(btn('big',T('फिर खेलें','Play again'),()=>go(memory)))}
   }else setTimeout(()=>{x.b.classList.remove('up');y.b.classList.remove('up');open=[]},900);
  });
  const inner=el('span');inner.append(el('i','','❓'),el('i','',c.face));b.append(inner);grid.append(b);
 });
 a.append(info,grid);
}
function trace(a){
 head(a,'✍️ '+T('अक्षर लिखो','Trace Letters'),T('हल्के अक्षर पर उँगली फेरो।','Trace over the faint letter.'));
 const sets=[['अ आ इ',AKSHAR.map(x=>x[0])],['ABC',[...'ABCDEFGHIJKLMNOPQRSTUVWXYZ']],['123',[...'0123456789']]];
 let list=sets[0][1],i=0,drawn=0,on=false;
 const tabs=el('div','top'),p=el('div','panel'),c=el('canvas'),msg=el('p','sub');
 c.width=c.height=600;const x=c.getContext('2d');
 const paint=()=>{
  drawn=0;msg.textContent='';x.clearRect(0,0,600,600);
  x.fillStyle='#cfd8f7';x.font='400px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(list[i],300,320);
 };
 const at=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*600/r.width,(e.clientY-r.top)*600/r.height]};
 c.onpointerdown=e=>{on=true;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...at(e))};
 c.onpointermove=e=>{if(!on)return;x.strokeStyle='#e0245e';x.lineWidth=28;x.lineCap='round';x.lineTo(...at(e));x.stroke();drawn++};
 c.onpointerup=c.onpointercancel=()=>{on=false;if(drawn>15)msg.textContent=T('👏 अच्छा अभ्यास!','👏 Nice practice!')};
 sets.forEach(([label,l])=>tabs.append(btn('pill',label,()=>{list=l;i=0;paint()})));
 p.append(c,msg,
  btn('pill','🔊',()=>speak(list[i],/[A-Z0-9]/.test(list[i])?'en':'hi')),' ',
  btn('pill',T('मिटाओ','Clear'),paint),' ',
  btn('big',T('अगला ➡️','Next ➡️'),()=>{i=(i+1)%list.length;paint()}));
 a.append(tabs,p);paint();
}
